[project]
name = "backend"
version = "0.2.0"
description = "Ashlynn Antrobus personal blog"
requires-python = "==3.13.5"
authors = [{ name = "Ashlynn Antrobus" }]
dependencies = [
  "bleach>=6.0.0,<7.0.0",
  "cryptography>=46.0.3",
  "flask>=3.1.2",
  "flask-cors>=6.0.1",
  "markdown-it-py>=3.0.0,<4.0.0",
  "psycopg2-binary>=2.9.11",
  "pydantic>=2.12.4",
  "pydantic-settings>=2.12.0",
  "pygments>=2.17.0,<3.0.0",
  "pyjwt>=2.10.1",
  "pyyaml>=6.0.3",
  "requests>=2.32.5",
  "sqlmodel>=0.0.27",
]

[project.scripts]
create-schema = "scripts.create_schema:main"
dev_flask = "scripts.run_dev_server:main"
process-notifications = "scripts.process_notifications:main"

[dependency-groups]
dev = [
  "freezegun>=1.5.5",
  "mypy>=1.18.2",
  "pytest>=9.0.0",
  "pytest-cov>=7.0.0",
  "types-bleach>=6.1.0.20240331",
  "types-flask>=1.1.6",
  "types-flask-cors>=6.0.0.20250809",
  "types-pygments>=2.19.0.20251121",
  "types-pyyaml>=6.0.12.20250915",
  "types-requests>=2.32.4.20250913",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.11.0"]
build-backend = "uv_build"

[tool.mypy]
check_untyped_defs = true
explicit_package_bases = true
follow_imports = "silent"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
plugins = ["pydantic.mypy"]
python_version = "3.13"
warn_return_any = true

[tool.pytest]
addopts = ["--cov-fail-under=80", "--cov-report=json", "--cov=.", "-rf"]
markers = ["external: mark a test as requiring external an external dependency"]
minversion = "9.0"
pythonpath = [".", "src"]
testpaths = ["docs", "tests"]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
ignore = ["A002", "ANN003", "ANN204", "ANN401", "D100", "D417"]
select = ["A", "ANN", "D", "E", "F", "I", "N", "UP", "W"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104", "E402"]
"**/{tests,docs,tools}/*" = ["ANN001", "ANN201", "D", "E402", "E501", "I001"]
"config.py" = ["ANN003", "N802", "N803"]

[tool.ty.environment]
root = ["./src", "."]

[tool.uv]
link-mode = "copy"
required-version = ">=0.9.5"
