name: Deployment

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: https://${{ secrets.DOMAIN }}/api

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: build/

  deploy:
    name: Deploy to Production
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download frontend build
        uses: actions/download-artifact@v6
        with:
          name: frontend-build
          path: build/

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/blog_cicd
          chmod 600 ~/.ssh/blog_cicd

      - name: Run Deployment Script
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          SERVER_IP_ADDRESS: ${{ secrets.SERVER_IP_ADDRESS }}
          SSH_PRIVATE_KEY_PATH: /home/runner/.ssh/blog_cicd
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VENV_PATH: ${{ secrets.VENV_PATH }}
          LITESPEED: ${{ vars.LITESPEED || secrets.LITESPEED }}
        run: |
          if [ "$LITESPEED" = "true" ]; then
            echo "Using LiteSpeed deployment script..."
            scripts/litespeed_deploy.sh
          else
            echo "Using standard deployment script..."
            scripts/deploy.sh
          fi
