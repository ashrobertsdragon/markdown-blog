openapi: 3.0.0
info:
  title: Blog API
  version: 1.0.0
  description: >
    REST API for the Flask + React blog platform. Provides endpoints
    for post management, revision tracking, comments, and
    notifications. All authenticated endpoints require a Clerk-issued
    JWT Bearer token.

servers:
  - url: /api
    description: Application API root

security:
  - bearerAuth: []

paths:
  /posts/{slug}/revisions:
    get:
      operationId: listRevisions
      summary: List revision history for a post
      description: >
        Returns paginated revision history sorted most-recent-first.
        Each revision includes the commit SHA, author ID, timestamp,
        relative time string, commit message, and a flag indicating
        whether it was a revert commit. Only the post author or an
        admin may access this endpoint.
      tags:
        - Revision Tracking
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
          description: Number of records to skip for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of records to return per page
      responses:
        '200':
          description: Paginated list of revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionListResponse'
              example:
                revisions:
                  - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    commit_sha: "abc123def456abc123def456abc123def456abc1"
                    short_sha: "abc123d"
                    author_id: "f1e2d3c4-b5a6-9870-fedc-ba9876543210"
                    timestamp: "2024-11-10T15:30:00+00:00"
                    relative_time: "2 days ago"
                    commit_message: "Update introduction paragraph"
                    is_revert: false
                total_count: 42
                has_more: true
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidSkip:
                  value:
                    error: "skip must be between 0 and 10000"
                invalidLimit:
                  value:
                    error: "limit must be between 1 and 100"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /posts/{slug}/revisions/{sha}:
    get:
      operationId: getRevision
      summary: Get a single revision by commit SHA
      description: >
        Returns the full content of a post at a specific commit SHA,
        including both raw markdown and sanitized rendered HTML.
        Includes a flag indicating whether this is the currently
        active revision. Only the post author or an admin may access
        this endpoint.
      tags:
        - Revision Tracking
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ShaParam'
      responses:
        '200':
          description: Revision details with content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionDetailResponse'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                commit_sha: "abc123def456abc123def456abc123def456abc1"
                short_sha: "abc123d"
                author_id: "f1e2d3c4-b5a6-9870-fedc-ba9876543210"
                timestamp: "2024-11-10T15:30:00+00:00"
                commit_message: "Update introduction paragraph"
                markdown_content: "# My Post\n\nIntroduction content..."
                html_content: "<h1>My Post</h1><p>Introduction content...</p>"
                is_current: false
                is_revert: false
        '400':
          description: Invalid SHA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptySha:
                  value:
                    error: "SHA cannot be empty"
                shaTooLong:
                  value:
                    error: "SHA length 101 exceeds maximum of 100"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /posts/{slug}/revisions/{sha1}/diff/{sha2}:
    get:
      operationId: compareRevisions
      summary: Compare two revisions and generate a diff
      description: >
        Generates a line-by-line diff between two revisions identified
        by commit SHAs. Returns structured diff lines annotated with
        type (context, addition, or deletion). SHA order is
        significant: sha1 is the "from" (older) revision, sha2 is
        the "to" (newer) revision. Only the post author or an admin
        may access this endpoint.
      tags:
        - Revision Tracking
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - name: sha1
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
          description: Commit SHA of the older ("from") revision
        - name: sha2
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
          description: Commit SHA of the newer ("to") revision
      responses:
        '200':
          description: Diff between the two revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
              example:
                from_revision:
                  sha: "abc123def456abc123def456abc123def456abc1"
                  short_sha: "abc123d"
                  timestamp: "2024-11-09T10:00:00+00:00"
                  author_id: "f1e2d3c4-b5a6-9870-fedc-ba9876543210"
                to_revision:
                  sha: "def456abc123def456abc123def456abc123def4"
                  short_sha: "def456a"
                  timestamp: "2024-11-10T15:30:00+00:00"
                  author_id: "f1e2d3c4-b5a6-9870-fedc-ba9876543210"
                diff_lines:
                  - type: "context"
                    content: "# My Post"
                  - type: "deletion"
                    content: "Old introduction paragraph."
                  - type: "addition"
                    content: "New introduction paragraph."
                  - type: "context"
                    content: ""
        '400':
          description: Invalid SHA parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyFromSha:
                  value:
                    error: "from_sha cannot be empty"
                emptyToSha:
                  value:
                    error: "to_sha cannot be empty"
                fromShaTooLong:
                  value:
                    error: "from_sha length 101 exceeds maximum of 100"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /posts/{slug}/revert:
    post:
      operationId: revertToRevision
      summary: Revert a post to a previous revision
      description: >
        Restores draft content to the state at a specified commit SHA.
        Creates a new GitHub commit with message "Revert to
        {short-sha}: {original-message}" and a corresponding
        PostRevision record. Previous history is preserved — this
        operation is non-destructive. Only the post author or an
        admin may revert.
      tags:
        - Revision Tracking
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevertRequest'
            example:
              target_sha: "abc123def456"
      responses:
        '200':
          description: Post successfully reverted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevertResponse'
              example:
                success: true
                message: "Post reverted to abc123d"
                new_commit_sha: "xyz789abc123xyz789abc123xyz789abc123xyz7"
                redirect_url: "/edit/my-post"
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notJson:
                  value:
                    error: "Request body must be JSON"
                missingField:
                  value:
                    error: "Missing required field: target_sha"
                shaTooLong:
                  value:
                    error: "target_sha length 101 exceeds maximum of 100"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: GitHub commit or filesystem write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts/{slug}/comments:
    get:
      operationId: listComments
      summary: List published comments for a post
      description: >
        Returns paginated comments for a post. Authentication is optional.
        Unauthenticated users see only published comments. Admins see
        pending and deleted comments. Comments are returned sorted by
        creation time.
      tags:
        - Comments
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
          description: Number of records to skip for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of records to return per page
      responses:
        '200':
          description: Paginated list of comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'
              example:
                comments:
                  - id: 1
                    post_id: 42
                    text: "Great post!"
                    parent_id: null
                    created_at: "2024-11-15T10:30:00+00:00"
                    updated_at: "2024-11-15T10:30:00+00:00"
                    is_deleted: false
                    is_pending_moderation: false
                    is_post_author: false
                total_count: 5
                has_more: false
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidLimit:
                  value:
                    error: "limit must be between 1 and 100"
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: postComment
      summary: Post a new comment on a post
      description: >
        Creates a new comment on a published post. Requires authentication.
        Rate-limited to 5 comments per minute per user; bypassed for admins.
        Comments may be flagged for moderation based on spam detection.
        Returns the created comment with 201 status. Publishes new comment
        to SSE stream.
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
            example:
              text: "This is a great post!"
      responses:
        '201':
          description: Comment created successfully
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Maximum requests allowed per time window
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in current time window
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when rate limit resets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notJson:
                  value:
                    error: "Request body must be JSON"
                missingText:
                  value:
                    error: "Missing required field: text"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '429':
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Maximum requests allowed per time window
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining (always 0)
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when rate limit resets
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /posts/{slug}/comments/stream:
    get:
      operationId: streamComments
      summary: Stream new comments as Server-Sent Events
      description: >
        Opens a persistent connection that streams new comments as
        Server-Sent Events. Authentication is optional. Clients may pass
        last_comment_id query parameter to receive only comments posted
        after a specific comment ID (useful for reconnection). Returns
        text/event-stream response with data: fields containing JSON
        comment objects.
      tags:
        - Comments
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - name: last_comment_id
          in: query
          required: false
          schema:
            type: integer
          description: Comment ID to resume after on reconnect
      responses:
        '200':
          description: Server-Sent Event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {
                  "id": 1,
                  "post_id": 42,
                  "text": "Great post!",
                  "parent_id": null,
                  "created_at": "2024-11-15T10:30:00+00:00",
                  "updated_at": "2024-11-15T10:30:00+00:00",
                  "is_deleted": false,
                  "is_pending_moderation": false,
                  "is_post_author": false
                }
        '400':
          description: Invalid last_comment_id parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "last_comment_id must be an integer"
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /posts/{slug}/comments/{comment_id}/reply:
    post:
      operationId: postReply
      summary: Post a reply to an existing comment
      description: >
        Creates a reply to an existing comment. Verifies the parent comment
        belongs to the given post. Requires authentication. Subject to the
        same rate limiting and spam detection as top-level comments. The
        convention is to prefix reply text with @username for mentions.
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/CommentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
            example:
              text: "@username Great point!"
      responses:
        '201':
          description: Reply created successfully
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Maximum requests allowed per time window
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in current time window
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when rate limit resets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notJson:
                  value:
                    error: "Request body must be JSON"
                missingText:
                  value:
                    error: "Missing required field: text"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Post or parent comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                postNotFound:
                  value:
                    error: "Post not found"
                commentNotFound:
                  value:
                    error: "Comment not found"
        '429':
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Maximum requests allowed per time window
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining (always 0)
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when rate limit resets
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /posts/{slug}/comments/{comment_id}:
    delete:
      operationId: deleteComment
      summary: Delete a comment
      description: >
        Deletes a comment. Comment authors hard-delete their own comments
        (removed from database). Admins and post authors soft-delete any
        comment (marked as deleted, row preserved). Requires authentication.
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/CommentIdParam'
      responses:
        '204':
          description: Comment deleted successfully (no content)
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Post or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                postNotFound:
                  value:
                    error: "Post not found"
                commentNotFound:
                  value:
                    error: "Comment not found"
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/comments/{comment_id}/approve:
    put:
      operationId: approveComment
      summary: Approve a comment pending moderation
      description: >
        Approves a comment pending moderation. Only accessible to admins.
        Transitions the comment from pending to published state.
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommentIdParam'
      responses:
        '200':
          description: Comment approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CommentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/comments/{comment_id}:
    delete:
      operationId: adminDeleteComment
      summary: Soft-delete a comment as admin
      description: >
        Soft-deletes a comment via moderation action. Only accessible to
        admins. Marks the comment as deleted without removing the row,
        preserving reply thread coherence.
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommentIdParam'
      responses:
        '204':
          description: Comment deleted successfully (no content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CommentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued JWT token

  parameters:
    SlugParam:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
      description: URL slug identifying the post
    ShaParam:
      name: sha
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
      description: Full or abbreviated commit SHA
    CommentIdParam:
      name: comment_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Comment ID identifying the comment

  schemas:
    RevisionSummary:
      type: object
      description: Revision metadata without content
      properties:
        id:
          type: string
          format: uuid
        commit_sha:
          type: string
          description: Full 40-character commit SHA
        short_sha:
          type: string
          description: First 7 characters of commit SHA
        author_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        relative_time:
          type: string
          description: Human-readable elapsed time (e.g. "2 days ago")
        commit_message:
          type: string
        is_revert:
          type: boolean
      required:
        - id
        - commit_sha
        - short_sha
        - author_id
        - timestamp
        - relative_time
        - commit_message
        - is_revert

    RevisionListResponse:
      type: object
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/RevisionSummary'
        total_count:
          type: integer
          description: Total number of revisions for this post
        has_more:
          type: boolean
          description: Whether more revisions exist beyond this page
      required:
        - revisions
        - total_count
        - has_more

    RevisionDetailResponse:
      type: object
      description: Single revision with full content
      properties:
        id:
          type: string
          format: uuid
        commit_sha:
          type: string
          description: Full 40-character commit SHA
        short_sha:
          type: string
          description: First 7 characters of commit SHA
        author_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        commit_message:
          type: string
        markdown_content:
          type: string
          description: Raw markdown content at this revision
        html_content:
          type: string
          description: Sanitized rendered HTML content
        is_current:
          type: boolean
          description: True if this is the most recent revision
        is_revert:
          type: boolean
      required:
        - id
        - commit_sha
        - short_sha
        - author_id
        - timestamp
        - commit_message
        - markdown_content
        - html_content
        - is_current
        - is_revert

    RevisionRef:
      type: object
      description: Minimal revision reference used in diff responses
      properties:
        sha:
          type: string
          description: Full 40-character commit SHA
        short_sha:
          type: string
          description: First 7 characters of commit SHA
        timestamp:
          type: string
          format: date-time
        author_id:
          type: string
          format: uuid
      required:
        - sha
        - short_sha
        - timestamp
        - author_id

    DiffLine:
      type: object
      properties:
        type:
          type: string
          enum: [context, addition, deletion]
          description: >
            Line classification: context = unchanged, addition =
            added in to_revision, deletion = removed in to_revision
        content:
          type: string
          description: Line content (without leading +/- markers)
      required:
        - type
        - content

    DiffResponse:
      type: object
      properties:
        from_revision:
          $ref: '#/components/schemas/RevisionRef'
        to_revision:
          $ref: '#/components/schemas/RevisionRef'
        diff_lines:
          type: array
          items:
            $ref: '#/components/schemas/DiffLine'
      required:
        - from_revision
        - to_revision
        - diff_lines

    RevertRequest:
      type: object
      properties:
        target_sha:
          type: string
          maxLength: 100
          description: Commit SHA to revert the post to
      required:
        - target_sha

    RevertResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          description: Confirmation message including the short SHA
        new_commit_sha:
          type: string
          description: Full SHA of the newly created revert commit
        redirect_url:
          type: string
          description: Frontend path to the post edit page
      required:
        - success
        - message
        - new_commit_sha
        - redirect_url

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        required_role:
          type: string
          description: Optional role name required for authorization failures
      required:
        - error

    CommentRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: Comment text content
      required:
        - text

    CommentResponse:
      type: object
      description: Comment data with moderation and author information
      properties:
        id:
          type: integer
          description: Comment ID
        post_id:
          type: integer
          description: Post ID this comment belongs to
        text:
          type: string
          description: Comment text content
        parent_id:
          type: integer
          nullable: true
          description: ID of parent comment if this is a reply, null otherwise
        created_at:
          type: string
          format: date-time
          description: Timestamp when comment was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when comment was last updated
        is_deleted:
          type: boolean
          description: True if comment has been deleted (soft or hard)
        is_pending_moderation:
          type: boolean
          description: True if comment awaiting admin review
        is_post_author:
          type: boolean
          description: True if comment author is the post author
      required:
        - id
        - post_id
        - text
        - parent_id
        - created_at
        - updated_at
        - is_deleted
        - is_pending_moderation
        - is_post_author

    CommentListResponse:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'
        total_count:
          type: integer
          description: Total number of comments for this post
        has_more:
          type: boolean
          description: Whether more comments exist beyond this page
      required:
        - comments
        - total_count
        - has_more

    AdminCommentResponse:
      type: object
      description: >
        Admin comment response including author_id (internal identifier).
        Returned by admin moderation endpoints that need full comment data.
      properties:
        id:
          type: integer
          description: Comment ID
        post_id:
          type: integer
          description: Post ID this comment belongs to
        author_id:
          type: integer
          description: Author user ID
        text:
          type: string
          description: Comment text content
        parent_id:
          type: integer
          nullable: true
          description: ID of parent comment if this is a reply, null otherwise
        created_at:
          type: string
          format: date-time
          description: Timestamp when comment was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when comment was last updated
        is_deleted:
          type: boolean
          description: True if comment has been deleted (soft or hard)
        is_pending_moderation:
          type: boolean
          description: True if comment awaiting admin review
      required:
        - id
        - post_id
        - author_id
        - text
        - parent_id
        - created_at
        - updated_at
        - is_deleted
        - is_pending_moderation

    RateLimitResponse:
      type: object
      properties:
        error:
          type: string
          description: Rate limit exceeded error message
        code:
          type: string
          enum: [rate_limit_exceeded]
        retry_after:
          type: integer
          description: Seconds to wait before retrying
      required:
        - error
        - code
        - retry_after

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Valid token but user lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            generic:
              value:
                error: "Not authorized to view revisions"
            roleRequired:
              value:
                error: "Admin role required"
                required_role: "admin"

    PostNotFound:
      description: No post exists with the given slug
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Post 'my-post' not found"

    CommentNotFound:
      description: No comment exists with the given ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Comment not found"

    NotFound:
      description: Post or revision not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            postNotFound:
              value:
                error: "Post 'my-post' not found"
            revisionNotFound:
              value:
                error: "Revision not found"

    InternalError:
      description: Unexpected server error or data integrity issue
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Revision Tracking
    description: >-
      Browse post commit history, view previous versions, compare
      diffs, and revert
  - name: Comments
    description: >-
      Post, list, and manage comments. Includes moderation controls,
      rate limiting, and real-time updates via Server-Sent Events
